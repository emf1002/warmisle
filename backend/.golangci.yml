version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

issues:
  exclude-use-default: false
  exclude-rules:
    # 允许 main 包中 main 函数不处理错误（程序入口）
    - path: cmd/.*
      linters:
        - errcheck
