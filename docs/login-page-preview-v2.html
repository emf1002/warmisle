<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖屿 WarmIsle — 登录 V2 夜屿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --amber: #E5A84B;
    --amber-light: #F0C273;
    --amber-dark: #C48A30;
    --amber-glow: rgba(229, 168, 75, 0.2);
    --night-deep: #0F1729;
    --night-mid: #1A2340;
    --night-soft: #243054;
    --night-card: rgba(26, 35, 64, 0.85);
    --text-bright: #F0EDE8;
    --text-soft: #A8B4C8;
    --text-muted: #6B7A94;
    --border-night: rgba(255, 255, 255, 0.08);
    --white: #FFFFFF;
    --radius: 16px;
    --radius-sm: 12px;
    --font-display: 'Noto Serif SC', 'PingFang SC', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font-body);
    color: var(--text-bright);
    background: var(--night-deep);
    overflow: hidden;
  }

  /* ====== FULL-SCREEN NIGHT SCENE ====== */
  .login-scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(ellipse 80% 60% at 30% 20%, rgba(36, 48, 84, 0.8) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 70% 80%, rgba(40, 30, 60, 0.5) 0%, transparent 50%),
      linear-gradient(180deg, #0B1120 0%, #0F1729 40%, #162040 100%);
    overflow: hidden;
  }

  /* Stars */
  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #FFF;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: var(--max-opacity); transform: scale(1.2); }
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFF8E7 0%, #F0D890 40%, #D4A850 100%);
    box-shadow:
      0 0 40px rgba(240, 216, 144, 0.3),
      0 0 80px rgba(240, 216, 144, 0.15),
      0 0 120px rgba(240, 216, 144, 0.08);
    opacity: 0;
    animation: moonRise 2s ease-out 0.5s forwards;
  }

  .moon-crater {
    position: absolute;
    border-radius: 50%;
    background: rgba(180, 150, 80, 0.15);
  }

  .moon-crater-1 { width: 15px; height: 15px; top: 20px; left: 25px; }
  .moon-crater-2 { width: 10px; height: 10px; top: 40px; left: 15px; }
  .moon-crater-3 { width: 8px; height: 8px; top: 30px; left: 45px; }

  @keyframes moonRise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 100px;
    filter: blur(20px);
  }

  .cloud-1 {
    width: 300px; height: 60px;
    top: 18%; left: -50px;
    animation: cloudDrift 60s linear infinite;
  }

  .cloud-2 {
    width: 200px; height: 40px;
    top: 30%; right: -30px;
    animation: cloudDrift 80s linear infinite reverse;
  }

  @keyframes cloudDrift {
    from { transform: translateX(-100%); }
    to { transform: translateX(calc(100vw + 100%)); }
  }

  /* Landscape silhouette */
  .landscape {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 200px;
    pointer-events: none;
  }

  .landscape-svg {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
  }

  /* Lighthouse / House glow */
  .lighthouse-glow {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(229, 168, 75, 0.15) 0%, transparent 70%);
    animation: glowPulse 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
  }

  /* Water reflection */
  .water {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 80px;
    background: linear-gradient(180deg, rgba(15, 23, 41, 0) 0%, rgba(20, 30, 55, 0.8) 100%);
    pointer-events: none;
  }

  .water-line {
    position: absolute;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(229, 168, 75, 0.15) 30%, rgba(229, 168, 75, 0.25) 50%, rgba(229, 168, 75, 0.15) 70%, transparent 100%);
    animation: waterShimmer var(--dur) ease-in-out infinite;
  }

  @keyframes waterShimmer {
    0%, 100% { opacity: 0.3; transform: scaleX(0.8); }
    50% { opacity: 0.8; transform: scaleX(1); }
  }

  /* ====== GLASS LOGIN CARD ====== */
  .login-card {
    position: relative;
    z-index: 10;
    width: 420px;
    max-width: 92vw;
    padding: 48px 40px;
    background: var(--night-card);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid var(--border-night);
    border-radius: var(--radius);
    box-shadow:
      0 8px 40px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    opacity: 0;
    animation: cardAppear 1s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
  }

  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Top accent line */
  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    border-radius: 0 0 3px 3px;
  }

  .card-brand {
    text-align: center;
    margin-bottom: 36px;
  }

  .card-brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(229, 168, 75, 0.15) 0%, rgba(229, 168, 75, 0.05) 100%);
    border: 1px solid rgba(229, 168, 75, 0.2);
    margin-bottom: 16px;
  }

  .card-brand-icon svg {
    width: 28px;
    height: 28px;
  }

  .card-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 6px;
    letter-spacing: 0.06em;
  }

  .card-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .input-group {
    margin-bottom: 20px;
  }

  .input-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-soft);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .input-field {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-bright);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-night);
    border-radius: var(--radius-sm);
    outline: none;
    transition: all 0.3s ease;
  }

  .input-field::placeholder {
    color: var(--text-muted);
    font-weight: 300;
  }

  .input-field:hover {
    border-color: rgba(229, 168, 75, 0.3);
    background: rgba(255, 255, 255, 0.06);
  }

  .input-field:focus {
    border-color: var(--amber);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(229, 168, 75, 0.1);
  }

  .remember-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .remember-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-soft);
    cursor: pointer;
    user-select: none;
  }

  .remember-label input[type="checkbox"] {
    appearance: none;
    width: 16px;
    height: 16px;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.04);
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
  }

  .remember-label input[type="checkbox"]:checked {
    background: var(--amber);
    border-color: var(--amber);
  }

  .remember-label input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4px; top: 1.5px;
    width: 5px; height: 8px;
    border: solid var(--night-deep);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .forgot-link {
    font-size: 13px;
    color: var(--amber);
    text-decoration: none;
    font-weight: 400;
    transition: color 0.2s;
  }

  .forgot-link:hover {
    color: var(--amber-light);
  }

  .login-button {
    width: 100%;
    height: 52px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--night-deep);
    background: linear-gradient(135deg, var(--amber-light) 0%, var(--amber) 50%, var(--amber-dark) 100%);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(229, 168, 75, 0.25);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
  }

  .login-button::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(229, 168, 75, 0.35);
  }

  .login-button:hover::before {
    opacity: 1;
  }

  .login-button:active {
    transform: translateY(0);
  }

  .form-footer {
    margin-top: 32px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 520px) {
    .login-card {
      padding: 36px 28px;
      margin: 0 16px;
    }

    .moon {
      width: 50px;
      height: 50px;
      top: 5%;
      right: 8%;
    }

    .card-brand-icon {
      width: 48px;
      height: 48px;
    }

    .card-title {
      font-size: 20px;
    }
  }
</style>
</head>
<body>

<div class="login-scene">
  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Moon -->
  <div class="moon">
    <div class="moon-crater moon-crater-1"></div>
    <div class="moon-crater moon-crater-2"></div>
    <div class="moon-crater moon-crater-3"></div>
  </div>

  <!-- Clouds -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>

  <!-- Lighthouse glow -->
  <div class="lighthouse-glow"></div>

  <!-- Landscape silhouette -->
  <div class="landscape">
    <svg class="landscape-svg" viewBox="0 0 1440 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Island/hills silhouette -->
      <path d="M0 200 L0 160 Q100 120 200 140 Q280 90 350 100 Q400 60 440 80 L460 75 L462 30 L468 30 L470 75 Q480 78 500 90 Q560 60 640 80 Q720 100 800 90 Q880 70 960 85 Q1040 100 1100 75 Q1150 50 1200 80 Q1300 110 1400 95 L1440 100 L1440 200Z" fill="#0B1120"/>
      <!-- House on the island -->
      <rect x="445" y="48" width="30" height="27" rx="2" fill="#162040"/>
      <path d="M440 50 L460 30 L480 50" fill="none" stroke="#1A2340" stroke-width="2"/>
      <!-- House window glow -->
      <rect x="452" y="55" width="8" height="8" rx="1" fill="rgba(229,168,75,0.4)"/>
      <rect x="464" y="55" width="8" height="8" rx="1" fill="rgba(229,168,75,0.3)"/>
      <!-- Trees -->
      <circle cx="420" cy="72" r="12" fill="#0F1729"/>
      <circle cx="495" cy="68" r="10" fill="#0F1729"/>
      <circle cx="410" cy="78" r="8" fill="#0D1425"/>
    </svg>
  </div>

  <!-- Water reflection -->
  <div class="water">
    <div class="water-line" style="bottom: 55px; --dur: 5s;"></div>
    <div class="water-line" style="bottom: 40px; --dur: 6s;"></div>
    <div class="water-line" style="bottom: 25px; --dur: 7s;"></div>
    <div class="water-line" style="bottom: 12px; --dur: 5.5s;"></div>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <div class="card-brand">
      <div class="card-brand-icon">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 15 L14 6 L24 15" stroke="#E5A84B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="8" y="14" width="12" height="10" rx="1.5" stroke="#E5A84B" stroke-width="1.5" fill="none"/>
          <rect x="12" y="18" width="4" height="6" rx="2" stroke="#E5A84B" stroke-width="1.2" fill="none"/>
          <circle cx="14" cy="10" r="1.5" fill="#E5A84B" opacity="0.5"/>
        </svg>
      </div>
      <div class="card-title">暖 屿</div>
      <div class="card-subtitle">家是夜里最温暖的光</div>
    </div>

    <form onsubmit="return false;">
      <div class="input-group">
        <label class="input-label" for="username">用户名</label>
        <input class="input-field" type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
      </div>

      <div class="input-group">
        <label class="input-label" for="password">密码</label>
        <input class="input-field" type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" />
          记住登录状态
        </label>
        <a href="#" class="forgot-link">忘记密码？</a>
      </div>

      <button type="submit" class="login-button">登 录</button>
    </form>

    <div class="form-footer">
      &copy; 2026 暖屿 WarmIsle
    </div>
  </div>
</div>

<script>
  // Generate stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 70 + '%';
    star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    star.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7));
    star.style.animationDelay = Math.random() * 5 + 's';
    star.style.width = (1 + Math.random() * 2) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
