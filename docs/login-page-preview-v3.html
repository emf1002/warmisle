<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖屿 WarmIsle — 登录 V3 晨屿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --coral: #E87461;
    --coral-light: #F09888;
    --coral-dark: #D05A48;
    --peach: #FDDAC6;
    --gold: #F2B84B;
    --gold-light: #F7D08A;
    --teal: #6BBAA7;
    --teal-light: #A8D8CA;
    --lavender: #C5B3D9;
    --sky: #B8D4E8;
    --bg: #FDF8F4;
    --bg-card: rgba(255, 255, 255, 0.72);
    --text-primary: #3D3530;
    --text-secondary: #8A807A;
    --text-muted: #B8AFA8;
    --border: rgba(61, 53, 48, 0.08);
    --white: #FFFFFF;
    --radius: 20px;
    --radius-sm: 14px;
    --font-display: 'Noto Serif SC', 'PingFang SC', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font-body);
    color: var(--text-primary);
    background: var(--bg);
    overflow: hidden;
  }

  .login-scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* ====== BACKGROUND ORGANIC SHAPES ====== */
  .bg-shapes {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0;
    animation: blobIn 2s ease-out forwards;
  }

  .blob-1 {
    width: 500px; height: 500px;
    top: -15%; left: -10%;
    background: radial-gradient(circle, var(--peach) 0%, transparent 70%);
    animation-delay: 0.2s;
  }

  .blob-2 {
    width: 400px; height: 400px;
    top: 10%; right: -8%;
    background: radial-gradient(circle, var(--sky) 0%, transparent 70%);
    animation-delay: 0.4s;
  }

  .blob-3 {
    width: 350px; height: 350px;
    bottom: -10%; left: 20%;
    background: radial-gradient(circle, var(--teal-light) 0%, transparent 70%);
    animation-delay: 0.6s;
  }

  .blob-4 {
    width: 300px; height: 300px;
    bottom: 5%; right: 10%;
    background: radial-gradient(circle, var(--lavender) 0%, transparent 70%);
    animation-delay: 0.8s;
    opacity: 0;
    animation: blobIn 2s ease-out 0.8s forwards, blobFloat 12s ease-in-out 3s infinite;
  }

  @keyframes blobIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 0.5; transform: scale(1); }
  }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(15px, -20px) scale(1.03); }
    66% { transform: translate(-10px, 15px) scale(0.97); }
  }

  /* Grid pattern overlay */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(61, 53, 48, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61, 53, 48, 0.02) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  /* Floating decorative elements */
  .float-deco {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    animation: floatIn 1s ease-out forwards;
  }

  .float-circle {
    border-radius: 50%;
    border: 2px solid;
  }

  .fc-1 {
    width: 20px; height: 20px;
    top: 15%; left: 12%;
    border-color: var(--coral-light);
    animation-delay: 1.2s;
    animation-name: floatIn, floatBob1;
    animation-duration: 1s, 6s;
    animation-timing-function: ease-out, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-delay: 1.2s, 2.2s;
  }

  .fc-2 {
    width: 14px; height: 14px;
    top: 25%; right: 18%;
    border-color: var(--teal);
    animation-delay: 1.4s;
    animation-name: floatIn, floatBob2;
    animation-duration: 1s, 7s;
    animation-timing-function: ease-out, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-delay: 1.4s, 2.4s;
  }

  .fc-3 {
    width: 10px; height: 10px;
    bottom: 20%; left: 8%;
    background: var(--gold-light);
    border-radius: 50%;
    animation-delay: 1.6s;
    animation-name: floatIn, floatBob3;
    animation-duration: 1s, 8s;
    animation-timing-function: ease-out, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-delay: 1.6s, 2.6s;
  }

  .fc-4 {
    width: 16px; height: 16px;
    bottom: 30%; right: 10%;
    border-color: var(--lavender);
    border-radius: 4px;
    transform: rotate(45deg);
    animation-delay: 1.8s;
    animation-name: floatIn, floatBob1;
    animation-duration: 1s, 9s;
    animation-timing-function: ease-out, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-delay: 1.8s, 2.8s;
  }

  .fc-5 {
    width: 8px; height: 8px;
    top: 60%; left: 25%;
    background: var(--coral-light);
    border-radius: 50%;
    animation-delay: 2s;
    animation-name: floatIn, floatBob2;
    animation-duration: 1s, 5s;
    animation-timing-function: ease-out, ease-in-out;
    animation-fill-mode: forwards, none;
    animation-iteration-count: 1, infinite;
    animation-delay: 2s, 3s;
  }

  @keyframes floatIn {
    from { opacity: 0; }
    to { opacity: 0.6; }
  }

  @keyframes floatBob1 {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes floatBob2 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }

  @keyframes floatBob3 {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* ====== MAIN LAYOUT ====== */
  .login-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 80px;
    max-width: 960px;
    width: 100%;
    padding: 0 40px;
  }

  /* ====== LEFT: BRAND SECTION ====== */
  .brand-section {
    flex: 1;
    opacity: 0;
    animation: slideRight 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
  }

  @keyframes slideRight {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(232, 116, 97, 0.08);
    border: 1px solid rgba(232, 116, 97, 0.15);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    color: var(--coral);
    margin-bottom: 28px;
    letter-spacing: 0.03em;
  }

  .brand-badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--coral);
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .brand-heading {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .brand-heading-en {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .brand-desc {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.8;
    max-width: 340px;
    margin-bottom: 40px;
  }

  .brand-features {
    display: flex;
    gap: 24px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .feature-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .feature-icon-ledger { background: rgba(232, 116, 97, 0.1); }
  .feature-icon-todo { background: rgba(107, 186, 167, 0.12); }
  .feature-icon-wish { background: rgba(242, 184, 75, 0.12); }
  .feature-icon-forum { background: rgba(197, 179, 217, 0.15); }

  /* ====== RIGHT: LOGIN CARD ====== */
  .login-card {
    flex: 0 0 400px;
    background: var(--bg-card);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: var(--radius);
    padding: 44px 36px;
    box-shadow:
      0 4px 24px rgba(61, 53, 48, 0.06),
      0 1px 3px rgba(61, 53, 48, 0.04);
    opacity: 0;
    animation: cardSlide 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
  }

  @keyframes cardSlide {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    margin-bottom: 32px;
  }

  .card-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .logo-mark {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(232, 116, 97, 0.25);
  }

  .logo-mark svg {
    width: 22px;
    height: 22px;
  }

  .logo-text {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.04em;
  }

  .card-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .card-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .input-group {
    margin-bottom: 18px;
  }

  .input-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 7px;
  }

  .input-field {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-primary);
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: all 0.25s ease;
  }

  .input-field::placeholder {
    color: var(--text-muted);
    font-weight: 300;
  }

  .input-field:hover {
    border-color: rgba(232, 116, 97, 0.25);
  }

  .input-field:focus {
    border-color: var(--coral);
    box-shadow: 0 0 0 4px rgba(232, 116, 97, 0.08);
  }

  .remember-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .remember-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
  }

  .remember-label input[type="checkbox"] {
    appearance: none;
    width: 17px;
    height: 17px;
    border: 1.5px solid rgba(61, 53, 48, 0.15);
    border-radius: 5px;
    background: var(--white);
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
  }

  .remember-label input[type="checkbox"]:checked {
    background: var(--coral);
    border-color: var(--coral);
  }

  .remember-label input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4.5px; top: 2px;
    width: 5px; height: 8px;
    border: solid var(--white);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .forgot-link {
    font-size: 13px;
    color: var(--coral);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }

  .forgot-link:hover {
    color: var(--coral-dark);
  }

  .login-button {
    width: 100%;
    height: 52px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--white);
    background: linear-gradient(135deg, var(--coral-light) 0%, var(--coral) 50%, var(--coral-dark) 100%);
    background-size: 200% 200%;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(232, 116, 97, 0.3);
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
  }

  .login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(232, 116, 97, 0.4);
    background-position: 100% 0;
  }

  .login-button:active {
    transform: translateY(0);
    box-shadow: 0 2px 12px rgba(232, 116, 97, 0.3);
  }

  .form-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 860px) {
    .login-wrapper {
      flex-direction: column;
      gap: 32px;
      padding: 40px 24px;
      overflow-y: auto;
      max-height: 100vh;
    }

    .brand-section {
      text-align: center;
    }

    .brand-heading {
      font-size: 36px;
    }

    .brand-desc {
      margin-left: auto;
      margin-right: auto;
    }

    .brand-features {
      justify-content: center;
      flex-wrap: wrap;
    }

    .login-card {
      flex: none;
      width: 100%;
      max-width: 400px;
    }
  }

  @media (max-width: 480px) {
    .login-wrapper {
      padding: 24px 16px;
    }

    .brand-heading {
      font-size: 28px;
    }

    .brand-features {
      gap: 12px;
    }

    .feature-item {
      font-size: 12px;
    }

    .login-card {
      padding: 32px 24px;
    }
  }
</style>
</head>
<body>

<div class="login-scene">
  <!-- Background organic blobs -->
  <div class="bg-shapes">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Grid pattern -->
  <div class="bg-grid"></div>

  <!-- Floating decorations -->
  <div class="float-deco float-circle fc-1"></div>
  <div class="float-deco float-circle fc-2"></div>
  <div class="float-deco fc-3"></div>
  <div class="float-deco float-circle fc-4"></div>
  <div class="float-deco fc-5"></div>

  <!-- Main Content -->
  <div class="login-wrapper">
    <!-- Left: Brand -->
    <div class="brand-section">
      <div class="brand-badge">
        <span class="brand-badge-dot"></span>
        家庭数字中心
      </div>
      <div class="brand-heading">暖 屿</div>
      <div class="brand-heading-en">Warm Isle</div>
      <div class="brand-desc">
        全家人的记账、待办、愿望、交流。<br>
        一个温暖的地方，搞定所有家庭琐事。
      </div>
      <div class="brand-features">
        <div class="feature-item">
          <div class="feature-icon feature-icon-ledger">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="#E87461" stroke-width="1.5"/><path d="M5 7h8M5 10h5" stroke="#E87461" stroke-width="1.2" stroke-linecap="round"/></svg>
          </div>
          <span>记账</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon feature-icon-todo">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="#6BBAA7" stroke-width="1.5"/><path d="M6 9l2 2 4-4" stroke="#6BBAA7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span>待办</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon feature-icon-wish">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3l2 4 4.5.7-3.3 3.2.8 4.5L9 13.2 4.9 15.4l.8-4.5L2.5 7.7 7 7z" stroke="#F2B84B" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </div>
          <span>愿望</span>
        </div>
        <div class="feature-item">
          <div class="feature-icon feature-icon-forum">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 4h12a1 1 0 011 1v7a1 1 0 01-1 1h-3l-3 3-3-3H3a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="#C5B3D9" stroke-width="1.3"/><path d="M6 7h6M6 10h3" stroke="#C5B3D9" stroke-width="1.1" stroke-linecap="round"/></svg>
          </div>
          <span>论坛</span>
        </div>
      </div>
    </div>

    <!-- Right: Login Card -->
    <div class="login-card">
      <div class="card-header">
        <div class="card-logo">
          <div class="logo-mark">
            <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 12 L11 5 L19 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="6" y="11" width="10" height="8" rx="1.5" stroke="white" stroke-width="1.5" fill="none"/>
              <rect x="9" y="14" width="4" height="5" rx="2" stroke="white" stroke-width="1.2" fill="none"/>
            </svg>
          </div>
          <span class="logo-text">暖屿</span>
        </div>
        <div class="card-title">欢迎回来</div>
        <div class="card-subtitle">登录你的账号，继续温暖的一天</div>
      </div>

      <form onsubmit="return false;">
        <div class="input-group">
          <label class="input-label" for="username">用户名</label>
          <input class="input-field" type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
        </div>

        <div class="input-group">
          <label class="input-label" for="password">密码</label>
          <input class="input-field" type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" />
            记住登录状态
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="login-button">登 录</button>
      </form>

      <div class="form-footer">
        &copy; 2026 暖屿 WarmIsle &middot; 家庭数字中心
      </div>
    </div>
  </div>
</div>

</body>
</html>
